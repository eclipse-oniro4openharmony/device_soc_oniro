{
    "services" : [{
            "name" : "waydroid_supervisor",
            "path" : [ "/system/bin/sh", "/system/etc/waydroid/waydroid-supervisor.sh" ],
            "uid" : "root",
            "gid" : [ "root" ],
            "start-mode" : "condition",
            "disabled" : 1
        }
    ],
    "jobs" : [{
            "name" : "boot",
            "cmds" : [
                "start waydroid_supervisor"
            ]
        }, {
            "name" : "post-fs-data",
            "cmds" : [
                "start waydroid_supervisor"
            ]
        }, {
            "name" : "param:persist.waydroid.enabled=1",
            "condition" : "persist.waydroid.enabled=1",
            "cmds" : [
                "start waydroid_supervisor"
            ]
        }
    ]
}
