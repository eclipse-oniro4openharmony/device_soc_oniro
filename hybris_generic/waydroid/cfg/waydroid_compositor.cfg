{
    "services" : [{
            "name" : "waydroid_compositor",
            "path" : [ "/system/bin/waydroid_compositor" ],
            "uid" : "root",
            "gid" : [ "root", "graphics", "system" ],
            "caps" : [ "SYS_ADMIN", "DAC_OVERRIDE", "SYS_NICE", "IPC_LOCK" ],
            "start-mode" : "condition",
            "disabled" : 1,
            "sandbox" : 0,
            "critical" : [ 0, 5, 60 ]
        }
    ],
    "jobs" : [{
            "name" : "param:persist.waydroid.enabled=1",
            "condition" : "persist.waydroid.enabled=1",
            "cmds" : [
                "start waydroid_compositor"
            ]
        }
    ]
}
