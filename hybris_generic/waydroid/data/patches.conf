# patches.conf — the binary patches the Waydroid container needs, as data.
#
# Installed to /system/etc/waydroid/patches.conf.  waydroidd applies it on
# EVERY container start: it reads each listed file out of the freshly mounted
# (read-only, pristine) images, rewrites the listed instruction words in
# memory, writes the result to /data/waydroid/run/patches/ and bind-mounts it
# over the original.  Nothing patched is ever stored or pushed, so
# /data/waydroid/images holds only unmodified upstream images and a stale
# patch can not survive an image change.
#
# If an <old> word does not match, the image is not the one these patches were
# derived for: waydroidd refuses to start the container and says so, instead of
# booting something that crash-loops without a tombstone.  Bump this file
# together with data/images.manifest.
#
# utils/host/waydroid-patches.sh (board repo) replays this table on the build
# host against the pinned images and checks the sha256 lines — run it after
# changing either file.
#
# Syntax (whitespace separated, '#' starts a comment):
#   file   <name> <mode> <path inside the container>
#   word   <name> <offset> <old> <new>          32-bit little-endian words
#   sha256 <name> <pristine> <patched>          host-side check only

# ── composer-service ────────────────────────────────────────────────────────
# main()'s configureRpcThreadpool(4, true) becomes (1, true):
#     0x7138: 52800080  mov w0, #4   ->   52800020  mov w0, #1
#
# The waydroid hwc module (hwcomposer.waydroid.so, hwc_open) spawns
# hwc_binder_thread, which calls configureRpcThreadpool(1, true) before
# registering the vendor.waydroid.{display,window,clipboard} HALs.  If that
# thread runs after main() has started the hwbinder pool (max 4), libhidlbase
# aborts: "Binder threadpool cannot be shrunk after starting".  A pure startup
# race that this container loses every boot; with both callers asking for 1 the
# shrink condition can never hold.  Mode 0755: it is bound over an executable.
# Upstream dropped the call only on dev/lineage-23.2 (Android 16).
#
# Re-derive:  llvm-objdump -d composer-service | grep -B2 configureRpcThreadpool
file   composer-service 0755 /vendor/bin/hw/android.hardware.graphics.composer@2.1-service
word   composer-service 0x7138 0x52800080 0x52800020
sha256 composer-service eaf399d0bd3c507db9d6d1106b70f611485291a09941a5a0eb6e70ced3077534 201d930fd1a7338dcfec25e2863e7e73288e4f8d809a433ca5d868301ee036ee

# ── libui.so ────────────────────────────────────────────────────────────────
# Gralloc4Mapper::createDescriptor CLEARS the buffer usage to its low 24 bits
# instead of rejecting phantom high bits.  Three instructions at the
# usage-validation check:
#
#     ands x3,x8,x11 ; b.eq OK ; adrp x1,..  (reject: "invalid usage bits", -22)
#   ->
#     and x11,x11,#0xffffff   usage &= 0xffffff        92405d6b
#     str x11,[x0,#32]        write the clean usage    f900100b
#     b   0x31b8c             continue the OK path     14000008
#
# The container is A13 (lineage-20) but the host Mali gralloc is A14 (MTK
# mt6878).  A13 libui builds a BufferDescriptorInfo whose usage carries phantom
# bits that the A14 Mali mapper rejects (attribute mask usage & 0xFFFE08282400)
# and that A13 libui's own validUsageBits rejects too.  SurfaceFlinger only ever
# requests 0x1b00 (HW_TEXTURE|HW_RENDER|HW_COMPOSER|HW_FB), none of them bad, so
# clearing usage to 0xffffff yields exactly the descriptor the A14 mapper wants.
# No upstream branch addresses this; it is specific to the A13-on-A14 skew.
#
# Re-derive:  grep -abo 'invalid usage bits' libui.so  -> the ands/b.eq just
#             above the __android_log_print reject in createDescriptor.
file   libui.so 0644 /system/lib64/libui.so
word   libui.so 0x31b64 0xea0b0103 0x92405d6b
word   libui.so 0x31b68 0x54000120 0xf900100b
word   libui.so 0x31b6c 0x90ffff61 0x14000008
sha256 libui.so ac348042db0e873f8b6d443ec545e961b14665e9e262da9f6a433a0b6da67c07 dd6a1a868c39ae75ab7e33ebe9b858bc4e3833fa932a9541824dc554f5dd4512
